[project]
name = "projet-ai28"
version = "0.1.0"
description = "Machine learning project on the Adult Income dataset (UCI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Data manipulation
    "pandas>=2.2",
    "numpy>=2.0",
    # Machine learning — core
    "scikit-learn>=1.5",
    # Gradient boosting
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "catboost>=1.2",
    # Hyperparameter optimisation
    "optuna>=3.6",
    "optuna-integration[sklearn]>=3.6",
    # Visualisation
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "plotly>=5.22",
    # Dataset download
    "ucimlrepo>=0.0.7",
    # Utilities
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "nbformat>=5.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adult_income"]

[dependency-groups]
dev = [
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "nbformat>=5.10",
]
